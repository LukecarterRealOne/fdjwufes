name: Build VLine Practice Tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate a complete, corrected project (root or ZIP)
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          source_rel='src/client/java/com/vlineaim/training/VLineTrainingClient.java'

          is_current_project() {
            local root="$1"
            [[ -f "$root/build.gradle" && -f "$root/settings.gradle" \
              && -f "$root/src/main/resources/fabric.mod.json" \
              && -f "$root/$source_rel" ]] || return 1
            # Reject only the obsolete API call that caused the shown compile error.
            ! grep -q 'shouldRenderHitboxes[[:space:]]*(' "$root/$source_rel"
          }

          project_root=''
          if is_current_project "$GITHUB_WORKSPACE"; then
            project_root="$GITHUB_WORKSPACE"
            echo 'Using the complete project checked into the repository root.'
          else
            echo 'The repository root is incomplete; scanning ZIP files for a corrected project.'
            shopt -s nullglob
            archives=("$GITHUB_WORKSPACE"/*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo '::error::No project ZIP found. Upload the complete vline-practice-tools-current-source.zip to the repository root, or upload the extracted project files.'
              find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -not -path '*/.git/*' -print | sort || true
              exit 1
            fi

            index=0
            for archive in "${archives[@]}"; do
              index=$((index + 1))
              echo "Checking archive: $(basename "$archive")"
              temp_root="$RUNNER_TEMP/vline-project-$index"
              rm -rf "$temp_root"
              mkdir -p "$temp_root"
              if ! unzip -q "$archive" -d "$temp_root"; then
                echo "Skipping invalid ZIP: $(basename "$archive")"
                continue
              fi

              while IFS= read -r source_file; do
                [[ -n "$source_file" ]] || continue
                candidate_root="${source_file%/$source_rel}"
                if is_current_project "$candidate_root"; then
                  project_root="$candidate_root"
                  echo "Using corrected project from $(basename "$archive")"
                  break 2
                fi
              done < <(find "$temp_root" -type f -path "*/$source_rel" -print)

              # Also handle a project extracted directly to the ZIP temp directory.
              if is_current_project "$temp_root"; then
                project_root="$temp_root"
                echo "Using corrected project from $(basename "$archive")"
                break
              fi
            done

            if [[ -z "$project_root" ]]; then
              echo '::error::No ZIP contained the full project with the corrected VLineTrainingClient.java source.'
              echo 'Delete the old vline-practice-tools-source-fixed.zip and upload the newly downloaded vline-practice-tools-current-source.zip.'
              echo 'Files visible in the repository:'
              find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -not -path '*/.git/*' -print | sort || true
              echo 'The old API calls are:'
              grep -R -n 'shouldRenderHitboxes[[:space:]]*(' "$GITHUB_WORKSPACE" --include='VLineTrainingClient.java' || true
              exit 1
            fi
          fi

          if ! is_current_project "$project_root"; then
            echo '::error::Selected project is incomplete or still uses the removed API.'
            exit 1
          fi
          echo "project_dir=$project_root" >> "$GITHUB_OUTPUT"
          echo "Validated project: $project_root"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build mod
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache clean build

      - name: Prepare build artifact
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mapfile -t jars < <(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' -print | sort)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo '::error::Gradle completed but no distributable JAR was found in build/libs/.'
            find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -print || true
            exit 1
          fi
          for jar in "${jars[@]}"; do cp "$jar" "$GITHUB_WORKSPACE/dist/"; done
          printf 'Prepared: %s\n' "${jars[@]}"

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: vline-practice-tools-minecraft-26.1.2
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14
